name: Campaign engagement snapshots

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
concurrency:
  group: campaign-engagement-snapshots
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check for requested or scheduled captures
        id: queue
        env:
          RENDER_APP_URL: ${{ secrets.RENDER_APP_URL }}
          SNAPSHOT_SECRET: ${{ secrets.SNAPSHOT_SECRET }}
        run: echo "due=$(python campaign_worker.py --check)" >> "$GITHUB_OUTPUT"
      - name: Install Chromium
        if: steps.queue.outputs.due == 'true'
        run: |
          python -m pip install -r requirements-campaign.txt
          python -m playwright install --with-deps chromium --only-shell
      - name: Capture due campaign snapshots
        if: steps.queue.outputs.due == 'true'
        env:
          RENDER_APP_URL: ${{ secrets.RENDER_APP_URL }}
          SNAPSHOT_SECRET: ${{ secrets.SNAPSHOT_SECRET }}
        run: python campaign_worker.py
